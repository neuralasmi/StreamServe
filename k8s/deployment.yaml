apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamserve
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streamserve
  template:
    metadata:
      labels:
        app: streamserve
    spec:
      containers:
      - name: streamserve
        image: streamserve:latest
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
